name: ElasticBox
description: >-
  ElasticBox was a multi-cloud application management and deployment platform
  founded in 2011 by former Microsoft engineers Alberto Arias Maestro, Amadeo
  Casas, and Ravi Srivatsav (AngelPad-backed, offices in San Francisco and
  Madrid). Its "boxes" model let enterprise IT define, version, and orchestrate
  application deployments across more than a dozen clouds — AWS, Microsoft Azure,
  IBM SoftLayer, VMware, vCloud Air and others — with a self-service catalog,
  a REST API (token-authenticated, JSON), and a Jenkins CI plug-in. The company
  raised roughly $12.4M across three rounds, including a $9M Series A in 2014
  with participation from Andreessen Horowitz (a16z), Nexus Venture Partners,
  Intel Capital and Sierra Ventures. CenturyLink acquired ElasticBox in June
  2016 and rebuilt the technology as CenturyLink Cloud Application Manager (now
  part of Lumen). The standalone ElasticBox product, its developer portal, and
  its public API documentation have been retired; the elasticbox.com domain no
  longer serves the platform. This profile is preserved as a historical
  portfolio-lead record — no live, first-party API surface remains to enrich.
